<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3" />
        <path d="M10.9 5.1 9.1 9.1 5.1 10.9 6.9 6.9Z" fill="currentColor" />
      </svg>
      <span class="name">TrailSmith</span>
    </div>
    <button class="icon-btn" id="openOptions" title="设置" aria-label="设置">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
        stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
        <path d="M2.5 5.2h3.1M8.4 5.2h5.1" />
        <circle cx="7" cy="5.2" r="1.6" />
        <path d="M2.5 10.8h5.1M10.4 10.8h3.1" />
        <circle cx="9" cy="10.8" r="1.6" />
      </svg>
    </button>
  </header>

  <section class="metrics" id="metrics" aria-label="概览"></section>

  <section class="controls">
    <div class="field">
      <svg class="ico" viewBox="0 0 16 16" width="13" height="13" fill="none"
        stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.4" />
        <path d="M10.4 10.4 13.8 13.8" />
      </svg>
      <input id="search" type="search" autocomplete="off" placeholder="搜索标题、域名或关键词"
        aria-label="搜索记录" />
    </div>
    <select id="range" class="plain-select" aria-label="时间范围">
      <option value="1">今天</option>
      <option value="7" selected>近 7 天</option>
      <option value="0">全部</option>
    </select>
  </section>

  <section class="list" id="tree" aria-live="polite"></section>

  <footer class="bar-foot">
    <button class="btn" id="export">导出 JSON</button>
    <button class="btn btn-danger" id="clear">清空记录</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
